const CATS = ["Engine","Brakes","Suspension","Electrical","Body","Cooling","Filters"];
const MAKES = ["Maruti","Hyundai","Honda","Toyota","Mahindra","Tata","Kia"];
const inr = n => "₹" + Number(n).toLocaleString("en-IN");
const off = p => p.mrp>p.price ? Math.round((p.mrp-p.price)/p.mrp*100) : 0;
const badge = c => c==="NEW" ? '<span class="bg-accent text-accent-fg text-[11px] font-bold px-2 py-0.5 rounded-sm">NEW</span>'
  : c==="USED" ? '<span class="bg-used text-used-fg text-[11px] font-bold px-2 py-0.5 rounded-sm">USED</span>'
  : '<span class="bg-repair text-repair-fg text-[11px] font-bold px-2 py-0.5 rounded-sm">NEEDS REPAIR</span>';

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
let cart = load("apex-cart", {items:[], coupon:""});
let orders = load("apex-orders", []);

function cartCount(){ return cart.items.reduce((n,i)=>n+i.qty,0); }
function product(id){ return PRODUCTS.find(p=>p.id===id); }
function totals(){
  const lines = cart.items.map(i=>{ const p=product(i.productId); return p?{p,qty:i.qty,line:p.price*i.qty}:null; }).filter(Boolean);
  const sub = lines.reduce((n,l)=>n+l.line,0);
  const code = (cart.coupon||"").toUpperCase();
  let disc = 0;
  if(code==="CLEARANCE10") disc=Math.round(sub*0.1);
  if(code==="BOLT500" && sub>=3000) disc=500;
  if(code==="NOS15") disc=Math.round(sub*0.15);
  const ship = sub>=1999 || sub===0 ? 0 : 99;
  return {lines, sub, disc, ship, total: Math.max(0, sub-disc+ship)};
}
function addCart(id, qty=1){
  const p=product(id); if(!p) return;
  const e=cart.items.find(i=>i.productId===id);
  if(e) e.qty=Math.min(p.stock,e.qty+qty); else cart.items.push({productId:id, qty:Math.min(p.stock,qty)});
  save("apex-cart", cart); paintCount();
}
function setQty(id,q){
  if(q<=0) cart.items=cart.items.filter(i=>i.productId!==id);
  else cart.items=cart.items.map(i=>i.productId===id?{...i,qty:q}:i);
  save("apex-cart", cart); route();
}
function paintCount(){
  const el=document.getElementById("cart-count");
  const n=cartCount();
  if(n){ el.textContent=n; el.classList.remove("hidden"); el.classList.add("inline-grid"); }
  else { el.classList.add("hidden"); }
}

function parse(){
  const h=(location.hash||"#/").slice(1);
  const [path, qs] = h.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs||""));
  return { path: path || "/", params };
}
function go(path){
  location.hash = path.startsWith("#")?path:"#"+path;
}

document.getElementById("cats").innerHTML =
  `<a href="#/" class="shrink-0 px-3 py-2 text-xs font-semibold uppercase text-muted hover:text-fg">All stock</a>` +
  CATS.map(c=>`<a href="#/?category=${encodeURIComponent(c)}" class="shrink-0 px-3 py-2 text-xs font-semibold uppercase text-muted hover:text-fg">${c}</a>`).join("");

function card(p){
  const o=off(p);
  return `<a href="#/product/${p.id}" class="block rounded-xl border border-line bg-surface overflow-hidden hover:-translate-y-0.5 transition">
    <div class="relative aspect-[4/3] bg-elevated">
      <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover"/>
      <div class="absolute top-2.5 left-2.5">${badge(p.condition)}</div>
      ${o?`<div class="absolute top-2.5 right-2.5 bg-buy text-buy-fg text-[11px] font-bold px-1.5 py-0.5 rounded-sm">${o}% off</div>`:""}
    </div>
    <div class="p-3.5">
      <p class="text-[11px] uppercase text-muted">${p.brand} · ${p.category}</p>
      <h3 class="font-semibold text-sm mt-1">${p.name}</h3>
      <p class="text-xs text-muted">${p.make} ${p.model}</p>
      <p class="mt-2 font-bold">${inr(p.price)} ${o?`<span class="text-xs text-subtle line-through font-normal">${inr(p.mrp)}</span>`:""}</p>
    </div>
  </a>`;
}

function home(params){
  let list = PRODUCTS.filter(p=>{
    const q=(params.q||"").toLowerCase();
    const t=`${p.name} ${p.brand} ${p.make} ${p.model} ${p.oem} ${p.category}`.toLowerCase();
    return (!q||t.includes(q)) && (!params.category||p.category===params.category) && (!params.make||p.make===params.make) && (!params.condition||p.condition===params.condition);
  });
  if(params.sort==="price-asc") list=[...list].sort((a,b)=>a.price-b.price);
  else if(params.sort==="price-desc") list=[...list].sort((a,b)=>b.price-a.price);
  else list=[...list].sort((a,b)=>b.sold-a.sold);
  const browsing = !params.q && !params.category && !params.make && !params.condition;
  return `
    ${browsing?`<section class="mb-10 grid md:grid-cols-2 gap-8 items-center">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-accent">Final garage clearance</p>
        <h1 class="text-4xl sm:text-5xl font-bold mt-2 leading-tight">Auto parts at liquidation prices</h1>
        <p class="mt-4 text-muted max-w-md">New old stock, tested used, and project pieces. Search, cart, and checkout — no account needed.</p>
      </div>
    </section>`:""}
    <div class="flex items-end justify-between mb-4">
      <div>
        <h2 class="text-2xl font-bold">${params.q?`Results for “${params.q}”`:params.category||"Current stock"}</h2>
        <p class="text-sm text-muted">${list.length} parts</p>
      </div>
    </div>
    <div class="grid lg:grid-cols-[220px_1fr] gap-6">
      <aside class="rounded-xl border border-line bg-surface p-4 h-fit grid gap-3 text-sm">
        <label class="text-xs text-muted">Category
          <select class="mt-1 w-full h-11 bg-elevated border border-line rounded-md px-2" onchange="go('/?category='+this.value)">
            <option value="">All</option>${CATS.map(c=>`<option ${params.category===c?"selected":""}>${c}</option>`).join("")}
          </select>
        </label>
        <label class="text-xs text-muted">Make
          <select class="mt-1 w-full h-11 bg-elevated border border-line rounded-md px-2" onchange="go('/?make='+this.value)">
            <option value="">All</option>${MAKES.map(c=>`<option ${params.make===c?"selected":""}>${c}</option>`).join("")}
          </select>
        </label>
        <label class="text-xs text-muted">Condition
          <select class="mt-1 w-full h-11 bg-elevated border border-line rounded-md px-2" onchange="go('/?condition='+this.value)">
            <option value="">All</option>
            <option value="NEW" ${params.condition==="NEW"?"selected":""}>New</option>
            <option value="USED" ${params.condition==="USED"?"selected":""}>Used</option>
            <option value="REPAIR" ${params.condition==="REPAIR"?"selected":""}>Needs repair</option>
          </select>
        </label>
        <button class="h-11 border border-line rounded-md" onclick="go('/')">Reset</button>
      </aside>
      <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">${list.map(card).join("")||'<p class="text-muted">No parts match.</p>'}</div>
    </div>`;
}

function productPage(id){
  const p=product(id);
  if(!p) return `<p>Part not found. <a href="#/" class="text-accent">Back</a></p>`;
  const o=off(p);
  const similar=PRODUCTS.filter(x=>x.id!==p.id&&(x.category===p.category||x.make===p.make)).slice(0,4);
  return `<p class="text-xs text-muted"><a href="#/">Inventory</a> / ${p.category} / ${p.id}</p>
    <div class="mt-5 grid lg:grid-cols-2 gap-8">
      <div class="rounded-xl overflow-hidden border border-line bg-elevated"><img src="${p.image}" alt="${p.name}" class="w-full aspect-[4/3] object-cover"/></div>
      <div>
        <div class="flex gap-2 items-center">${badge(p.condition)}<span class="text-xs uppercase text-muted">${p.brand}</span></div>
        <h1 class="text-3xl font-bold mt-2">${p.name}</h1>
        <p class="text-sm text-muted mt-1">${p.make} ${p.model} · ${p.year}</p>
        <p class="mt-4 text-3xl font-bold">${inr(p.price)} ${o?`<span class="text-lg text-subtle line-through font-normal">${inr(p.mrp)}</span> <span class="text-accent text-sm">${o}% off</span>`:""}</p>
        <p class="mt-4 text-sm text-muted">${p.desc}</p>
        <p class="mt-3 text-sm">OEM <span class="font-mono">${p.oem}</span> · ${p.stock} left · ${p.deliveryDays} day delivery</p>
        <div class="mt-5 flex gap-3">
          <button class="flex-1 h-12 rounded-md bg-accent text-accent-fg font-semibold" onclick="addCart('${p.id}'); alert('Added to cart')">Add to cart</button>
          <button class="flex-1 h-12 rounded-md bg-buy text-buy-fg font-semibold" onclick="addCart('${p.id}'); go('/checkout')">Buy now</button>
        </div>
      </div>
    </div>
    <h2 class="text-2xl font-bold mt-12">Related</h2>
    <div class="mt-4 grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${similar.map(card).join("")}</div>`;
}

function cartPage(){
  const t=totals();
  if(!t.lines.length) return `<h1 class="text-3xl font-bold">Cart</h1><p class="mt-6 text-muted">Your cart is empty.</p><a href="#/" class="inline-flex mt-4 h-11 px-4 bg-accent text-accent-fg rounded-md items-center font-semibold">Shop</a>`;
  return `<h1 class="text-3xl font-bold">Cart</h1>
    <div class="mt-6 grid lg:grid-cols-[1fr_300px] gap-6">
      <div class="grid gap-3">${t.lines.map(l=>`
        <div class="flex gap-4 border border-line bg-surface rounded-xl p-3">
          <img src="${l.p.image}" class="w-24 h-24 object-cover rounded-md"/>
          <div class="flex-1 min-w-0">
            <a href="#/product/${l.p.id}" class="font-semibold">${l.p.name}</a>
            <p class="text-sm mt-1">${inr(l.p.price)}</p>
            <div class="mt-2 flex items-center gap-2">
              <button class="w-9 h-9 border border-line rounded" onclick="setQty('${l.p.id}',${l.qty-1})">−</button>
              <span>${l.qty}</span>
              <button class="w-9 h-9 border border-line rounded" onclick="setQty('${l.p.id}',${l.qty+1})">+</button>
              <span class="ml-auto font-semibold">${inr(l.line)}</span>
            </div>
          </div>
        </div>`).join("")}</div>
      <aside class="border border-line bg-surface rounded-xl p-5 h-fit">
        <h2 class="font-semibold">Summary</h2>
        <input id="coupon" value="${cart.coupon||""}" placeholder="Coupon" class="mt-3 w-full h-11 bg-elevated border border-line rounded-md px-3 uppercase"/>
        <button class="mt-2 w-full h-10 border border-line rounded-md" onclick="cart.coupon=document.getElementById('coupon').value; save('apex-cart',cart); route()">Apply</button>
        <p class="text-xs text-muted mt-2">CLEARANCE10 · BOLT500 · NOS15</p>
        <div class="mt-4 text-sm flex justify-between"><span class="text-muted">Subtotal</span><span>${inr(t.sub)}</span></div>
        <div class="text-sm flex justify-between"><span class="text-muted">Discount</span><span>${t.disc?("-"+inr(t.disc)):"—"}</span></div>
        <div class="text-sm flex justify-between"><span class="text-muted">Delivery</span><span>${t.ship?inr(t.ship):"Free"}</span></div>
        <div class="mt-3 pt-3 border-t border-line flex justify-between font-bold"><span>Total</span><span>${inr(t.total)}</span></div>
        <a href="#/checkout" class="mt-5 h-12 rounded-md bg-buy text-buy-fg font-semibold grid place-items-center">Checkout</a>
      </aside>
    </div>`;
}

function checkoutPage(){
  const t=totals();
  if(!t.lines.length) return `<p>Cart is empty. <a href="#/" class="text-accent">Shop</a></p>`;
  return `<h1 class="text-3xl font-bold">Checkout</h1>
    <form class="mt-6 grid lg:grid-cols-[1fr_300px] gap-6" onsubmit="placeOrder(event)">
      <div class="border border-line bg-surface rounded-xl p-5 grid gap-3">
        <h2 class="font-semibold">Delivery</h2>
        <input required name="name" placeholder="Full name" class="h-11 bg-elevated border border-line rounded-md px-3"/>
        <input required name="phone" placeholder="Phone" class="h-11 bg-elevated border border-line rounded-md px-3"/>
        <input required name="line1" placeholder="Address" class="h-11 bg-elevated border border-line rounded-md px-3"/>
        <div class="grid grid-cols-2 gap-3">
          <input required name="city" placeholder="City" class="h-11 bg-elevated border border-line rounded-md px-3"/>
          <input required name="pincode" placeholder="PIN" class="h-11 bg-elevated border border-line rounded-md px-3"/>
        </div>
        <label class="text-sm"><input type="radio" name="pay" value="cod" checked/> Cash / pickup</label>
        <label class="text-sm"><input type="radio" name="pay" value="upi"/> UPI</label>
        <label class="text-sm"><input type="radio" name="pay" value="card"/> Card</label>
      </div>
      <aside class="border border-line bg-surface rounded-xl p-5 h-fit">
        <p class="font-bold text-lg">${inr(t.total)}</p>
        <button class="mt-4 w-full h-12 rounded-md bg-buy text-buy-fg font-semibold">Place order</button>
      </aside>
    </form>`;
}
function placeOrder(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const t=totals();
  const id="AP"+Date.now().toString(36).toUpperCase();
  orders.unshift({id, createdAt:new Date().toISOString(), items:t.lines.map(l=>({productId:l.p.id,name:l.p.name,qty:l.qty,price:l.p.price,image:l.p.image})), total:t.total, address:{name:f.get("name"),phone:f.get("phone"),line1:f.get("line1"),city:f.get("city"),pincode:f.get("pincode")}, payment:f.get("pay"), status:"Placed"});
  save("apex-orders", orders);
  cart={items:[],coupon:""}; save("apex-cart", cart);
  go("/order/"+id);
}
function ordersPage(){
  if(!orders.length) return `<h1 class="text-3xl font-bold">Orders</h1><p class="mt-6 text-muted">No orders yet.</p>`;
  return `<h1 class="text-3xl font-bold">Orders</h1><div class="mt-6 grid gap-3">${orders.map(o=>`
    <a href="#/order/${o.id}" class="flex gap-4 border border-line bg-surface rounded-xl p-4">
      <img src="${o.items[0]?.image||""}" class="w-16 h-16 object-cover rounded-md"/>
      <div class="flex-1"><p class="font-mono text-xs text-muted">${o.id}</p><p class="font-semibold truncate">${o.items.map(i=>i.name).join(", ")}</p></div>
      <p class="font-semibold">${inr(o.total)}</p>
    </a>`).join("")}</div>`;
}
function orderPage(id){
  const o=orders.find(x=>x.id===id);
  if(!o) return `<p>Order not found.</p>`;
  return `<p class="text-xs uppercase tracking-widest text-accent">Order confirmed</p>
    <h1 class="text-3xl font-bold mt-2">${o.id}</h1>
    <p class="text-sm text-muted">${new Date(o.createdAt).toLocaleString("en-IN")} · ${o.status}</p>
    <div class="mt-6 border border-line bg-surface rounded-xl p-5 text-sm">
      ${o.address.name}<br>${o.address.line1}<br>${o.address.city} ${o.address.pincode}<br>${o.address.phone}
    </div>
    <ul class="mt-4 grid gap-3">${o.items.map(i=>`<li class="flex gap-3 border border-line bg-surface rounded-xl p-3"><img src="${i.image}" class="w-16 h-16 object-cover rounded-md"/><div class="flex-1">${i.name}<p class="text-xs text-muted">Qty ${i.qty}</p></div><span>${inr(i.price*i.qty)}</span></li>`).join("")}</ul>
    <p class="mt-4 font-bold text-xl">Paid ${inr(o.total)}</p>
    <a href="#/" class="inline-flex mt-6 h-11 px-4 bg-accent text-accent-fg rounded-md items-center font-semibold">Continue shopping</a>`;
}

function route(){
  paintCount();
  const {path, params} = parse();
  const app=document.getElementById("app");
  if(path.startsWith("/product/")) app.innerHTML=productPage(path.split("/")[2]);
  else if(path==="/cart") app.innerHTML=cartPage();
  else if(path==="/checkout") app.innerHTML=checkoutPage();
  else if(path==="/orders") app.innerHTML=ordersPage();
  else if(path.startsWith("/order/")) app.innerHTML=orderPage(path.split("/")[2]);
  else app.innerHTML=home(params);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
if(!location.hash) location.hash="#/";
else route();
</script>
</body>
</html>
